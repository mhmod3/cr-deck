<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>بصمة بكسل — M7mod</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  html,body{margin:0;width:1440px;height:900px;overflow:hidden;background:#101014}
  body{font-family:'Rubik',sans-serif;color:#f2f2f2;background-image:radial-gradient(rgba(242,242,242,.05) 1px,transparent 1px);background-size:12px 12px}
  .mono{font-family:ui-monospace,'Cascadia Mono',Consolas,monospace;font-variant-numeric:tabular-nums}
  .wrap{width:680px;margin:0 auto;padding:44px 0 24px;height:900px;box-sizing:border-box;display:flex;flex-direction:column}
  .stepped{clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px))}
  .brand{font-size:11px;letter-spacing:3px;color:#6a6f7a;margin-bottom:6px}
  h1{font-family:'Lalezar',cursive;font-size:72px;line-height:1;color:#f2f2f2;text-shadow:4px 4px 0 rgba(224,57,151,.6);margin:0 0 4px}
  .sub{font-size:13px;color:#8b8f98;margin-bottom:22px}
  /* شبكة البطاقات */
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
  .px{position:relative;background:#15161a;height:116px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .px .frame{position:absolute;inset:0;background:#2a2e37;clip-path:polygon(0 6px,6px 6px,6px 0,calc(100% - 6px) 0,calc(100% - 6px) 6px,100% 6px,100% calc(100% - 6px),calc(100% - 6px) calc(100% - 6px),calc(100% - 6px) 100%,6px 100%,6px calc(100% - 6px),0 calc(100% - 6px));z-index:0}
  .px .inner{position:relative;z-index:1;width:calc(100% - 12px);height:calc(100% - 12px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
  .px .stripe{position:absolute;top:50%;right:6px;transform:translateY(-50%);width:6px;height:56px;z-index:2}
  .px .nm{font-size:11px;font-weight:700;color:#cfd2d8}
  .px .el{position:absolute;top:8px;left:8px;width:22px;height:22px;background:#2a2e37;display:flex;align-items:center;justify-content:center;z-index:2}
  .px .el b{font-size:11px;font-weight:800;color:#f2f2f2}
  .px .q{font-family:'Lalezar',cursive;font-size:34px;color:#4c5058}
  .c .stripe{background:linear-gradient(to bottom,#b7c1cc 0 14px,transparent 14px 18px,#b7c1cc 18px 32px,transparent 32px 36px,#b7c1cc 36px 50px,transparent 50px)}
  .r .stripe{background:linear-gradient(to bottom,#ff9d2e 0 14px,transparent 14px 18px,#ff9d2e 18px 32px,transparent 32px 36px,#ff9d2e 36px 50px,transparent 50px)}
  .e .stripe{background:linear-gradient(to bottom,#b455e0 0 14px,transparent 14px 18px,#b455e0 18px 32px,transparent 32px 36px,#b455e0 36px 50px,transparent 50px)}
  .l .stripe{background:linear-gradient(to bottom,#ffd54a 0 14px,transparent 14px 18px,#ffd54a 18px 32px,transparent 32px 36px,#ffd54a 36px 50px,transparent 50px)}
  /* عدّاد الكشف */
  .counter{display:flex;align-items:center;gap:10px;margin-top:18px}
  .counter span{font-size:10px;letter-spacing:1px;color:#8b8f98}
  .sq{width:18px;height:18px;background:#101014;border:1px solid #2a2e37}
  .sq.on{background:#e03997;border-color:#e03997}
  /* شريط الإنشاء */
  .share{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end;padding-bottom:8px}
  .gen{background:#e03997;color:#101014;font-family:'Rubik',sans-serif;font-size:14px;font-weight:800;padding:12px 26px;border:none;cursor:pointer}
  .qrw{text-align:center}
  .qrbox{width:96px;height:96px;background:#f2f2f2;padding:6px;margin:0 auto}
  .qrbox .g{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:1px;height:100%}
  .qrbox .g i{background:#101014}
  .qrbox .g i.o{background:transparent}
  .qrcap{font-size:10px;color:#8b8f98;margin-top:6px}
  .foot{text-align:center;font-size:10px;color:#4c5058;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand mono">M7MOD</div>
  <h1>منشئ التشكيلات</h1>
  <div class="sub">أنشئ تشكيلة عشوائية من البطاقات واستوردها للعبة</div>

  <div class="grid">
    <div class="px c"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>5</b></div><div class="inner"><span class="nm">جنت</span></div></div>
    <div class="px l"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>5</b></div><div class="inner"><span class="nm">رايدر الهوغ</span></div></div>
    <div class="px c"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>2</b></div><div class="inner"><span class="nm">زوبين</span></div></div>
    <div class="px c"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>3</b></div><div class="inner"><span class="q">؟</span></div></div>
    <div class="px e"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>14</b></div><div class="inner"><span class="nm">غولم</span></div></div>
    <div class="px r"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>4</b></div><div class="inner"><span class="nm">فيلكي</span></div></div>
    <div class="px r"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>2</b></div><div class="inner"><span class="q">؟</span></div></div>
    <div class="px e"><div class="frame"></div><div class="stripe"></div><div class="el mono"><b>6</b></div><div class="inner"><span class="nm">مسدس</span></div></div>
  </div>

  <div class="counter">
    <span>كشف البطاقات</span>
    <i class="sq on"></i><i class="sq on"></i><i class="sq on"></i><i class="sq on"></i><i class="sq on"></i><i class="sq on"></i><i class="sq"></i><i class="sq"></i>
  </div>

  <div class="share">
    <button class="gen stepped">إنشاء تشكيلة</button>
    <div class="qrw">
      <div class="qrbox"><div class="g">
        <i></i><i></i><i class="o"></i><i></i><i class="o"></i><i></i>
        <i></i><i class="o"></i><i></i><i></i><i class="o"></i><i></i>
        <i class="o"></i><i></i><i></i><i class="o"></i><i></i><i class="o"></i>
        <i></i><i class="o"></i><i class="o"></i><i></i><i></i><i></i>
        <i class="o"></i><i></i><i></i><i class="o"></i><i class="o"></i><i></i>
        <i></i><i></i><i class="o"></i><i></i><i></i><i class="o"></i>
      </div></div>
      <div class="qrcap">امسح للاستيراد</div>
    </div>
  </div>
  <div class="foot">M7mod · Discord: _.m6</div>
</div>
</body>
</html>
